name: Dependency Updates

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update lockfile
        run: npm update --save

      - name: Run checks
        run: |
          npm run lint
          npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/dependency-update
          title: 'chore: weekly dependency update'
          commit-message: 'chore: weekly dependency update'
          body: Automated dependency update run.
